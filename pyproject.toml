[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roboenv-perception"
version = "0.2.0"
description = "CUDA-first VLM + SAM 3 perception and baseline evaluation for Real2Sim"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "Pillow>=10", "pydantic>=2.8,<3"]

[project.optional-dependencies]
grounded-sam2 = ["transformers>=4.51,<5", "huggingface-hub>=0.30,<1", "hydra-core>=1.3,<1.4", "iopath>=0.1.10", "tqdm>=4.66"]
construction = ["opencv-python-headless>=4.10", "plyfile>=1.1", "scipy>=1.13"]
dev = ["pytest>=8", "ruff>=0.11", "av>=14", "scipy>=1.13"]
video = ["av>=14"]
evaluation = ["scipy>=1.13"]
server = ["av>=14", "scipy>=1.13"]

[project.scripts]
scene-perception = "roboenv_perception.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
